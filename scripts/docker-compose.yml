services:
  rest:
    image: ${ICEBERG_REST_FIXTURE_IMAGE:-apache/iceberg-rest-fixture:1.10.1}
    container_name: iceberg-rest
    depends_on:
      s3-init:
        condition: service_completed_successfully
    networks:
      iceberg_net:
    ports:
      - 8181:8181
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
      - CATALOG_WAREHOUSE=s3://warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://seaweedfs:9000
      - CATALOG_S3_PATH__STYLE__ACCESS=true
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    container_name: seaweedfs
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
    networks:
      iceberg_net:
    ports:
      - 9000:9000
    command: ["server", "-dir=/data", "-ip=seaweedfs", "-s3", "-s3.port=9000"]
  s3-init:
    depends_on:
      - seaweedfs
    image: amazon/aws-cli:2.36.44
    container_name: s3-init
    networks:
      iceberg_net:
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws --endpoint-url http://seaweedfs:9000 s3 mb s3://warehouse; do
          echo 'Waiting for SeaweedFS...'
          sleep 2
        done
networks:
  iceberg_net:
