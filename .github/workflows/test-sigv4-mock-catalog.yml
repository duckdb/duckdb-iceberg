name: Test SigV4 Mock Reusable
on:
  workflow_call:
    inputs:
      artifact-name:
        description: "Name of the DuckDB-Iceberg artifact to download"
        required: true
        type: string

jobs:
  test-sigv4-mock:
    name: Test against SigV4 mock catalog
    runs-on: ubuntu-latest
    env:
      ASAN_SYMBOLIZER_PATH: "/usr/bin/llvm-symbolizer"
      ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1:abort_on_error=0:external_symbolizer_path=/usr/bin/llvm-symbolizer"
      LSAN_OPTIONS: "suppressions=${{ github.workspace }}/.combined-sanitizer-leak-suppressions.txt"
      UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'

      - name: Download DuckDB-Iceberg artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: build

      - name: Extract relassert build artifact
        run: |
          rm -rf build/relassert
          tar -xzf build/relassert-artifact.tar.gz -C build
          ls -lh build/relassert/test/unittest

      - name: Prepare leak suppressions
        run: |
          cp duckdb/.sanitizer-leak-suppressions.txt .combined-sanitizer-leak-suppressions.txt
          printf '\n' >> .combined-sanitizer-leak-suppressions.txt
          cat .sanitizer-leak-suppressions.txt >> .combined-sanitizer-leak-suppressions.txt

      # needs llvm for the external symbolizer path
      - name: Install dependencies
        run: |
          sudo apt update -y -qq
          sudo apt install -y -qq python3-venv tar pkg-config llvm

      - name: Run sigv4_mock tests
        env:
          SIGV4_MOCK_SERVER_AVAILABLE: 1
        run: |
          python3 scripts/sigv4_mock_server.py 19130 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:19130/v1/config > /dev/null; then
              break
            fi
            kill -0 $server_pid 2>/dev/null || { echo "sigv4 mock server died during startup"; exit 1; }
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:19130/v1/config > /dev/null; then
            echo "sigv4 mock server failed to start on port 19130"
            exit 1
          fi
          ./build/relassert/test/unittest --order lex "$PWD/test/sql/local/catalog_custom_setup/sigv4_mock/*" --list-test-names-only || true
          ./build/relassert/test/unittest --order lex "$PWD/test/sql/local/catalog_custom_setup/sigv4_mock/*"
