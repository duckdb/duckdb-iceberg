#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    # Keep the shared workflows and their checkouts aligned with the CI-tools submodule.
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@5a015b297d67d68952df00457dd4c37c0fc80ba3
    with:
      extension_name: iceberg
      ci_tools_version: 5a015b297d67d68952df00457dd4c37c0fc80ba3
      vcpkg_commit: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3
      exclude_archs: 'windows_amd64_mingw'
      extra_toolchains: 'python3'
      # Service-backed catalog tests run in BuildIceberg.yml's dedicated Linux jobs.
      # Keep distribution testing on the standard extension-ci-tools entry points.
      # Slow tests run in the fixture catalog workflows.
      test_config: '{"test_env_variables": {"T": "\"test/*\" \"exclude:*.test_slow\""}}'

  duckdb-stable-deploy:
    name: Deploy extension binaries
    needs: duckdb-stable-build
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_deploy.yml@5a015b297d67d68952df00457dd4c37c0fc80ba3
    secrets: inherit
    with:
      extension_name: iceberg
      ci_tools_version: 5a015b297d67d68952df00457dd4c37c0fc80ba3
      exclude_archs: 'windows_amd64_mingw'
      deploy_latest: ${{ startsWith(github.ref, 'refs/heads/v') || github.ref == 'refs/heads/main' }}
      deploy_versioned: ${{ startsWith(github.ref, 'refs/heads/v') || github.ref == 'refs/heads/main' }}

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@969bc76276acec1c0a3922ff500d2ec3a1a3b037 # v2.0-cyanoptera 2026-10-01 pin
    with:
      extension_name: iceberg
      ci_tools_version: 5a015b297d67d68952df00457dd4c37c0fc80ba3
      format_checks: 'format'
