#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  prepare:
    name: Prepare
    runs-on: ${{ github.repository_owner == 'duckdb' && 'namespace-profile-linux-slim' || 'ubuntu-slim' }}
    outputs:
      runners: ${{ steps.runners.outputs.runners }}
    steps:
      - name: Detect runners
        id: runners
        uses: duckdb/duckdb-ci/detect-runners@main

  build:
    name: Build extension
    needs: prepare
    uses: duckdb/extension-ci-tools/.github/workflows/build.yml@main
    with:
      groups: |
        main:
          config: extension_config.cmake
          toolchain: main
          extra_toolchains: python3
      runners: ${{ needs.prepare.outputs.runners }}
      exclude_archs: 'windows_amd64_mingw'

  deploy:
    name: Deploy extension
    needs: build
    uses: duckdb/extension-ci-tools/.github/workflows/deploy.yml@main
    secrets: inherit
    with:
      duckdb_version: ${{ needs.build.outputs.duckdb_version }}
      duckdb_commit: ${{ needs.build.outputs.duckdb_commit }}
      deploy_extensions: iceberg
      deploy_latest: ${{ startsWith(github.ref, 'refs/heads/v') || github.ref == 'refs/heads/main' }}
      deploy_versioned: ${{ startsWith(github.ref, 'refs/heads/v') || github.ref == 'refs/heads/main' }}

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@969bc76276acec1c0a3922ff500d2ec3a1a3b037 # v2.0-cyanoptera 2026-10-01 pin
    with:
      extension_name: iceberg
      ci_tools_version: 5a015b297d67d68952df00457dd4c37c0fc80ba3
      format_checks: 'format'
